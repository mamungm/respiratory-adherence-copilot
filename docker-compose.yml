version: "3.9"

# Local Postgres for development. Production points at Amazon RDS for
# Postgres instead (swap DATABASE_URL / PG* env vars, no code changes).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adherence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Official postgres image auto-runs any *.sql found here, in filename
      # order, the first time it initializes an empty data directory - no
      # separate migrate container needed. See note below about what
      # "first time" means for an already-existing volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # overrides backend/.env - containers reach Postgres by service name, not localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adherence
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
